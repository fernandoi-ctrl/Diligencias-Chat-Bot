server:
  port: ${PORT:8080}

spring:
  application:
    name: legal-whatsapp-bot
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        ssl: true
        sslmode: require
        sslcert: ""
        sslkey: ""
        sslrootcert: ""
  flyway:
     jdbc-properties:
       useSSL: "true"
       requireSSL: "true"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Supabase ya tiene las tablas de V1/V2 creadas a mano y no tiene historial de
  # Flyway: el primer arranque marca V2 como baseline y solo aplica V3 en adelante.
  # En una BD vacia no hay baseline y corren todas las migraciones.
  ai:
    openai:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: openai/gpt-oss-120b # <-- CAMBIA ESTO (o usa llama-3.3-70b-versatile si está disponible)
          temperature: 0.3
          max-tokens: 500

whatsapp:
  access-token: ${WHATSAPP_ACCESS_TOKEN}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  verify-token: ${WHATSAPP_VERIFY_TOKEN}
  api-url: https://graph.facebook.com/v21.0

# Origenes que pueden llamar a la API publica /api/v1 (la landing), separados por coma.
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

# Enlace publico de Google Calendar Appointment Schedules (opcional).
booking:
  url: ${GOOGLE_BOOKING_URL:}

chat:
  conversacion:
    horas-expiracion: 24
    mensajes-contexto: 20

logging:
  level:
    com.legal.bot: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.reactive.function.client: DEBUG